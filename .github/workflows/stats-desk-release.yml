# Stats Desk: the daily data release, for every dataset (scripts/release.py update). Asks
# MoSPI whether anything is newer than the raw tables kept in projects/stats_desk/data/raw (a
# few small requests per dataset); if so, fetches just that, rebuilds that dataset's release
# file and profiles, tests, commits the data, and starts the deploy.
#
# A figure MoSPI revised replaces ours (its figures are the official ones), is listed in
# projects/stats_desk/data/raw/REVISIONS.md, and is counted in the commit message.
#
# Each dataset on its own: one that fails (MoSPI down for it) fails the run, but another's new
# figures are still tested, committed and deployed (the steps below run unless cancelled).
#
# A commit pushed with GITHUB_TOKEN doesn't start other workflows, so the deploy is started
# explicitly (workflow_dispatch is the exception GitHub allows).

name: Stats Desk data release

on:
  schedule:
    - cron: "30 13 * * *"      # 19:00 India time, daily
  workflow_dispatch:

permissions:
  contents: write      # commit the new data
  actions: write       # start the deploy workflow

concurrency:
  group: stats-desk-release
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/stats_desk
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"

      - run: uv sync --locked

      - name: Anything new at MoSPI?
        id: update
        run: uv run python scripts/release.py update

      - name: Offline tests on the new release
        if: ${{ !cancelled() && steps.update.outputs.changed == 'true' }}
        run: uv run pytest -q

      - name: Commit the new data
        if: ${{ !cancelled() && steps.update.outputs.changed == 'true' }}
        env:
          SUMMARY: ${{ steps.update.outputs.summary }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw data/release data/profiles
          git commit -m "Stats Desk data: ${SUMMARY}"
          git push

      - name: Deploy it
        if: ${{ !cancelled() && steps.update.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run stats-desk-deploy.yml --ref main
